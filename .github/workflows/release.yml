name: Build and Release Khazna (Android APK, PC Web, Chrome Extension)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build All Releases
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Update Integrity & Prepare Web
        run: |
          node scripts/update-integrity.mjs

      - name: Package Chrome Extension
        run: |
          mkdir -p dist
          cd chrome-extension && zip -r ../dist/khazna-chrome-extension-v2.0.0.zip ./* && cd ..

      - name: Package PC Web Static Release
        run: |
          zip -r dist/khazna-pc-web-v2.0.0.zip \
            index.html manifest.webmanifest sw.js _headers app-integrity.json \
            local-server.mjs start-khazna.bat start-khazna.sh README.md SECURITY.md \
            styles icons src vendor package.json

      - name: Build Android APK (Capacitor)
        run: |
          cd android-wrapper
          npm install
          mkdir -p www
          cp -r ../index.html ../manifest.webmanifest ../sw.js ../_headers ../app-integrity.json ../styles ../icons ../src ../vendor www/
          npx cap add android || true
          npx cap sync android
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon
          mkdir -p ../../dist
          cp app/build/outputs/apk/debug/app-debug.apk ../../dist/khazna-v2.0.0.apk
          cd ../..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.ref_name || 'v2.0.0' }}
          name: "خزنة (Khazna) v2.0.0 — Android APK & PC Web & Chrome Extension"
          body: |
            ## 🎉 الإصدار 2.0.0 من خزنة (Khazna)
            
            مدير كلمات مرور وبطاقات وملاحظات مشفّرة محلي ١٠٠٪ بدون خوادم، بدون حسابات، وبياناتك لا تغادر جهازك أبداً.
            
            ### 📱 محتويات هذا الإصدار:
            
            1. **نسخة الأندرويد (`khazna-v2.0.0.apk`)**:
               - تطبيق أندرويد حقيقي يدعم البصمة البيومترية الحقيقية للجهاز.
               - اختصار في لوحة الإشعارات / الستارة (Quick Settings Tile) يفتح التطبيق كـ نافذة عائمة (Floating Pop-up).
               - دعم التثبيت فوق الشاشة (Stay on Top) لسهولة النسخ واللصق في التطبيقات الأخرى.
            
            2. **نسخة الكمبيوتر والمتصفح المباشر (`khazna-pc-web-v2.0.0.zip`)**:
               - فك الضغط وافتح `index.html` أو شغّل `start-khazna.bat` للعمل الفوري بدون أي تثبيت أو إنترنت.
            
            3. **إضافة متصفح كروم (`khazna-chrome-extension-v2.0.0.zip`)**:
               - Manifest V3 جاهز للتثبيت السريع عبر `chrome://extensions/`.
            
            ### ✨ الجديد في التحديث 2.0.0:
            - **إزالة زر التثبيت من الهيدر** (تم نقله للإعدادات للحفاظ على هدوء الشاشة).
            - **زر النسخ المزدوج**: نسخ اسم المستخدم وكلمة المرور معاً بنقرة واحدة!
            - **نقل كلمات المرور بين الأقسام**: زر نقل سريع ⇄ في كل بطاقة، ونقل جماعي بالـ multi-select.
            - **ثيمات مخصصة لكل قسم**: خلفيات زجاجية ملونة وتأثيرات ضوئية مميزة لكل قسم.
            - **عرض منظم وأشيك لكلمات المرور**: تجميع أنيق حسب الأقسام مع إمكانية طي وتوسيع كل قسم، وبانر هيرو خاص عند تصفية أي قسم.
          files: |
            dist/khazna-v2.0.0.apk
            dist/khazna-pc-web-v2.0.0.zip
            dist/khazna-chrome-extension-v2.0.0.zip
