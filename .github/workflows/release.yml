name: Build and Release Khazna v2 (Android APK, PC Standalone, Chrome Extension)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build All Releases
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Update Integrity & Prepare Web
        run: |
          node scripts/update-integrity.mjs

      # ─── PC Standalone Build ──────────────────────────────────────────────
      - name: Build PC Standalone (single-file + 3-file)
        run: |
          node scripts/build-standalone-pc.mjs
          # Zip the 3-file PC distribution
          mkdir -p dist
          cd dist/pc && zip -r ../khazna-pc-standalone-${{ github.ref_name }}.zip ./* && cd ../..
          echo "✓ PC standalone zip ready"

      # ─── Chrome Extension ─────────────────────────────────────────────────
      - name: Package Chrome Extension
        run: |
          mkdir -p dist
          cd chrome-extension && zip -r ../dist/khazna-chrome-extension-${{ github.ref_name }}.zip ./* && cd ..
          echo "✓ Chrome extension zip ready"

      # ─── Legacy PC Web ZIP (source distribution) ─────────────────────────
      - name: Package PC Web Source ZIP
        run: |
          zip -r dist/khazna-pc-web-${{ github.ref_name }}.zip \
            index.html manifest.webmanifest sw.js _headers app-integrity.json \
            local-server.mjs start-khazna.bat start-khazna.sh README.md SECURITY.md \
            styles icons src vendor package.json
          echo "✓ PC Web source zip ready"

      # ─── Android APK Build ───────────────────────────────────────────────
      - name: Install Android Wrapper Dependencies
        working-directory: android-wrapper
        run: npm install

      - name: Sync Web Assets to Capacitor www/
        working-directory: android-wrapper
        run: |
          mkdir -p www
          cp -r ../index.html ../manifest.webmanifest ../sw.js ../_headers ../app-integrity.json \
                ../styles ../icons ../src ../vendor www/

      - name: Capacitor Add & Sync Android
        working-directory: android-wrapper
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Setup Khazna Native Android Features
        working-directory: android-wrapper
        run: |
          node scripts/setup-android-native.mjs
          echo "✓ Native Android biometric + Quick Settings Tile injected"

      - name: Build Android APK (Capacitor + Gradle)
        working-directory: android-wrapper/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon
          mkdir -p ../../dist
          cp app/build/outputs/apk/debug/app-debug.apk ../../dist/khazna-${{ github.ref_name }}.apk
          echo "✓ APK built: khazna-${{ github.ref_name }}.apk"

      # ─── Create GitHub Release ────────────────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.ref_name || 'v2.1.0' }}
          name: "خزنة (Khazna) ${{ github.ref_name }} — Android APK & PC Standalone & Chrome Extension"
          body: |
            ## 🎉 الإصدار ${{ github.ref_name }} من خزنة (Khazna)

            مدير كلمات مرور وبطاقات وملاحظات مشفّرة محلي ١٠٠٪ بدون خوادم، بدون حسابات، وبياناتك لا تغادر جهازك أبداً.

            ---

            ### 📱 نسخة الأندرويد (`khazna-${{ github.ref_name }}.apk`)
            - **بصمة أندرويد حقيقية** بـ BiometricPrompt + AndroidKeyStore (AES-256-GCM) — صفر تسريب.
            - **Quick Settings Tile** في لوحة الإشعارات يفتح التطبيق كـ نافذة عائمة (Floating Overlay).
            - **دعم التثبيت فوق الشاشة** لسهولة النسخ واللصق أثناء استخدام تطبيقات أخرى.
            - **زر نسخ مزدوج** ينسخ اسم المستخدم وكلمة المرور معاً بنقرة واحدة.
            - **نقل كلمات المرور بين الأقسام** مع ثيمات مخصصة لكل قسم.

            > **تثبيت APK**: قد تحتاج تفعيل "تثبيت من مصادر غير معروفة" في إعدادات الأندرويد.

            ---

            ### 💻 نسخة PC المباشرة — ملف واحد! (`khazna.html`)
            - **انقر مرتين على `khazna.html`** في أي متصفح — يعمل فوراً بدون سيرفر أو تثبيت.
            - أو استخدم `khazna-pc-standalone-${{ github.ref_name }}.zip` (3 ملفات: index.html + CSS + JS).

            ---

            ### 🔵 إضافة متصفح كروم (`khazna-chrome-extension-${{ github.ref_name }}.zip`)
            - Manifest V3 جاهز للتثبيت عبر `chrome://extensions/` → Load unpacked.

            ---

            ### ✨ جديد في هذا الإصدار:
            - ✅ **بصمة أندرويد حقيقية** (BiometricPrompt + Android Keystore) — مختلفة عن WebAuthn تماماً
            - ✅ **Quick Settings Tile** + نافذة عائمة عند الوصول من الإشعارات
            - ✅ **نسخة PC ملف واحد** بدون سيرفر محلي
            - ✅ **زر النسخ المزدوج** (يوزر + باسوورد معاً)
            - ✅ **نقل الباسوردات بين الأقسام** مع ثيمات مخصصة
            - ✅ **عرض منظم بالأقسام** مع طي/توسيع وبانر هيرو لكل قسم

          files: |
            dist/khazna-${{ github.ref_name }}.apk
            dist/khazna.html
            dist/khazna-pc-standalone-${{ github.ref_name }}.zip
            dist/khazna-pc-web-${{ github.ref_name }}.zip
            dist/khazna-chrome-extension-${{ github.ref_name }}.zip
