name: Build and Release Khazna v2 (Android APK, PC Standalone, Chrome Extension)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build All Releases
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Run Automated Test Suite
        run: npm test

      - name: Update Integrity & Prepare Web
        run: |
          node scripts/update-integrity.mjs

      # ─── PC Standalone + Chrome Extension Bundle Build ───────────────────
      - name: Build PC Standalone & Sync Chrome Extension Bundle
        run: |
          node scripts/build-standalone-pc.mjs
          mkdir -p dist
          cd dist/pc && zip -r ../khazna-pc-standalone-${{ github.ref_name }}.zip ./* && cd ../..
          echo "✓ PC standalone zip ready"

      # ─── Chrome Extension ─────────────────────────────────────────────────
      - name: Package Chrome Extension
        run: |
          mkdir -p dist
          cd chrome-extension && zip -r ../dist/khazna-chrome-extension-${{ github.ref_name }}.zip ./* && cd ..
          echo "✓ Chrome extension zip ready"

      # ─── Legacy PC Web ZIP (source distribution) ─────────────────────────
      - name: Package PC Web Source ZIP
        run: |
          zip -r dist/khazna-pc-web-${{ github.ref_name }}.zip \
            index.html manifest.webmanifest sw.js _headers app-integrity.json \
            local-server.mjs start-khazna.bat start-khazna.sh README.md SECURITY.md \
            styles icons src vendor package.json
          echo "✓ PC Web source zip ready"

      # ─── Android APK Build ───────────────────────────────────────────────
      - name: Install Android Wrapper Dependencies
        working-directory: android-wrapper
        run: npm install

      - name: Sync Web Assets to Capacitor www/
        working-directory: android-wrapper
        run: |
          mkdir -p www
          cp -r ../index.html ../manifest.webmanifest ../sw.js ../_headers ../app-integrity.json \
                ../styles ../icons ../src ../vendor www/

      - name: Capacitor Add & Sync Android
        working-directory: android-wrapper
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Setup Khazna Native Android Features
        working-directory: android-wrapper
        run: |
          node scripts/setup-android-native.mjs
          echo "✓ Native Android biometric + Quick Settings Tile injected"

      - name: Build Android APK (Capacitor + Gradle)
        working-directory: android-wrapper/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon
          mkdir -p ../../dist
          cp app/build/outputs/apk/debug/app-debug.apk ../../dist/khazna-${{ github.ref_name }}.apk
          echo "✓ APK built: khazna-${{ github.ref_name }}.apk"

      # ─── Create GitHub Release ────────────────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.ref_name || 'v2.2.0' }}
          name: "خزنة (Khazna) ${{ github.ref_name }} — Android APK & PC Standalone & Chrome Extension"
          body: |
            ## 🎉 الإصدار ${{ github.ref_name }} من خزنة (Khazna)

            مدير كلمات مرور وبطاقات وملاحظات مشفّرة محلي ١٠٠٪ بدون خوادم، بدون حسابات، وبياناتك لا تغادر جهازك أبداً.

            ---

            ### 📱 نسخة الأندرويد (`khazna-${{ github.ref_name }}.apk`)
            - **بصمة أندرويد حقيقية** بـ BiometricPrompt + AndroidKeyStore (AES-256-GCM) مع التحقق الفوري أثناء التفعيل ودعم إعادة المصادقة للعمليات الحساسة (CVV/PIN/التصدير).
            - **حماية الشاشة (`FLAG_SECURE`)** لمنع لقطات الشاشة وتسجيل الشاشة + تعطيل `allowBackup` لحماية بيانات البصمة.
            - **Quick Settings Tile + إشعار الوصول السريع** بأيقونة مخصصة (مع دعم Android 9 إلى Android 15 وطلب إذن الإشعارات تلقائياً) لفتح التطبيق في نافذة عائمة سريعة.
            - **أبعاد مخصصة للهواتف** دون أي قص أو تمرير أفقي، مع حذف زر ZIP تماماً من شاشة القفل والإعدادات.

            ---

            ### 💻 نسخة PC المباشرة — ملف واحد! (`khazna.html`)
            - **انقر مرتين على `khazna.html`** في أي متصفح — يعمل فوراً عبر `file://` بدون سيرفر محلي أو تثبيت (تم إصلاح `LockManager` والحافظة للعمل المباشر 100%).
            - أو استخدم `khazna-pc-standalone-${{ github.ref_name }}.zip` (3 ملفات فقط: index.html + CSS + JS).

            ---

            ### 🔵 إضافة متصفح كروم (`khazna-chrome-extension-${{ github.ref_name }}.zip`)
            - **خزنة كاملة ومشفّرة داخل إضافة كروم (Manifest V3)** تعمل في النافذة المنبثقة أو تبويب كامل — أوفلاين 100% بدون أي روابط خارجية.

            ---

            ### 🛠️ أبرز الإصلاحات في v2.2.0:
            - ✅ إصلاح تعطل النقل الجماعي لكلمات المرور بين الأقسام (أصبح ذرياً مع لقطة تراجع تلقائية)
            - ✅ إصلاح حفظ البيانات عبر `file://` في `khazna.html` على الكمبيوتر
            - ✅ إصلاح إعادة المصادقة بالبصمة الأصلية على الأندرويد وتنظيف مفاتيح البصمة عند المسح
            - ✅ إصلاح توافق `KhaznaTileService` مع Android 9/10 وتفعيل وضع النافذة العائمة عند التشغيل البارد
            - ✅ تحويل إضافة كروم إلى خزنة مشفّرة حقيقية كاملة بدون أي روابط خارجية
            - ✅ إضافة تعديل لون وأيقونة الأقسام الحالية + اختبارات آلية شاملة (`npm test`)

          files: |
            dist/khazna-${{ github.ref_name }}.apk
            dist/khazna.html
            dist/khazna-pc-standalone-${{ github.ref_name }}.zip
            dist/khazna-pc-web-${{ github.ref_name }}.zip
            dist/khazna-chrome-extension-${{ github.ref_name }}.zip
