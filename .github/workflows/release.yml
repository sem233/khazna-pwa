name: Build and Release Khazna (Android APK + PC Package)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Android & PC Releases
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Run Automated Test Suite
        run: npm test

      - name: Update Integrity & Build PC Bundle
        run: |
          node scripts/update-integrity.mjs
          node scripts/build-standalone-pc.mjs

      # ─── Single Clean PC Package (khazna.html + chrome-extension/) ───────
      - name: Package Clean PC Release
        run: |
          mkdir -p dist/pc-stage
          cp dist/khazna.html dist/pc-stage/
          cp -r chrome-extension dist/pc-stage/chrome-extension
          cd dist/pc-stage && zip -r ../khazna-pc-${{ github.ref_name }}.zip khazna.html chrome-extension && cd ../..
          rm -rf dist/pc-stage
          echo "✓ Clean PC package ready: dist/khazna-pc-${{ github.ref_name }}.zip"

      # ─── Android APK Build ───────────────────────────────────────────────
      - name: Install Android Wrapper Dependencies
        working-directory: android-wrapper
        run: npm install

      - name: Sync Web Assets to Capacitor www/
        working-directory: android-wrapper
        run: |
          mkdir -p www
          cp -r ../index.html ../manifest.webmanifest ../sw.js ../_headers ../app-integrity.json \
                ../styles ../icons ../src ../vendor www/

      - name: Capacitor Add & Sync Android
        working-directory: android-wrapper
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Setup Khazna Native Android Features
        working-directory: android-wrapper
        run: |
          node scripts/setup-android-native.mjs

      - name: Build Android APK (Capacitor + Gradle)
        working-directory: android-wrapper/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon
          mkdir -p ../../dist
          cp app/build/outputs/apk/debug/app-debug.apk ../../dist/khazna-android-${{ github.ref_name }}.apk
          echo "✓ Clean Android APK ready: dist/khazna-android-${{ github.ref_name }}.apk"

      # ─── Create Clean GitHub Release (2 files ONLY: PC + Android) ────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.ref_name || 'v2.2.0' }}
          name: "خزنة (Khazna) ${{ github.ref_name }} — Android & PC"
          body: |
            ## 🎉 خزنة (Khazna) ${{ github.ref_name }}

            مدير كلمات مرور وبطاقات وملاحظات مشفّرة محلي ١٠٠٪ بدون خوادم، وبياناتك لا تغادر جهازك أبداً.

            ---

            ### 📱 للأندرويد — ملف واحد (`khazna-android-${{ github.ref_name }}.apk`)
            - تطبيق أندرويد حقيقي ببصمة الجهاز الأصلية (`BiometricPrompt + AndroidKeyStore`).
            - حماية الشاشة (`FLAG_SECURE`) لمنع لقطات الشاشة.
            - اختصار لوحة الإشعارات (`Quick Settings Tile`) يفتح نافذة عائمة سريعة.
            - زر نسخ مزدوج + نقل بين الأقسام + ثيمات مخصصة لكل قسم.

            ### 💻 للكمبيوتر (PC) — ملف واحد (`khazna-pc-${{ github.ref_name }}.zip`)
            يحتوي فقط على حاجة الكمبيوتر بدون أي زحمة:
            1. **`khazna.html`**: افتحه بنقرتين في أي متصفح ويعمل فوراً بدون سيرفر محلي.
            2. **مجلد `chrome-extension/`**: إضافة كروم كاملة وجاهزة للتثبيت عبر `chrome://extensions/` → `Load unpacked`.
          files: |
            dist/khazna-android-${{ github.ref_name }}.apk
            dist/khazna-pc-${{ github.ref_name }}.zip
